<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Lorraen Madre Library</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The Lorraen Madre Library — tools, calendars, frameworks and sprints for making wishes real.">
<link rel="canonical" href="https://www.lorraenmadre.com/library/">
<meta name="theme-color" content="#181713">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Belleza&family=Figtree:wght@400;500;600;700&family=Mulish:wght@400;500;600;700&family=Noto+Sans+Symbols+2&display=swap">
<link rel="stylesheet" href="/brand.css">
<style>
/* Library-only layout. Colors, fonts and .pill come from /brand.css (same as homepage). */
.lib-head{background:var(--night);color:var(--night-ink);padding:22px 16px 44px;text-align:center}
.lib-head .mark{display:inline-block;font-family:var(--display);font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;color:var(--night-ink)}
.lib-head .mark span{display:block;font-family:var(--sub);font-weight:600;font-size:.5rem;letter-spacing:.24em;opacity:.62;margin-top:3px}
.lib-head .eyebrow{display:block;margin-top:34px;color:#43C98A}
.lib-head h1{font-size:clamp(2.2rem,9vw,3.2rem);margin:.35rem 0 .4rem}
.lib-head p{color:var(--night-ink-2);max-width:32ch;margin:0 auto}
.wrap.lib{width:min(560px,100% - 32px);padding:28px 0 120px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;scroll-margin-top:16px}
.card:target{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.card h2{font-size:1.35rem}
.num{font-family:var(--sub);font-size:.66rem;letter-spacing:.14em;color:var(--ink-3)}
.card .eyebrow{display:block;margin-top:4px}
.desc{color:var(--ink-2);margin:.4rem 0 .9rem;font-size:.95rem}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions .pill{min-height:40px}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.price{font-family:var(--sub);font-weight:700;font-size:.8rem;letter-spacing:.04em}
.price.gold{color:var(--gold-deep);background:var(--gold-soft);border-radius:999px;padding:.3rem .7rem}
.tag{font-family:var(--sub);font-weight:700;font-size:.62rem;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);border:1.5px dashed var(--line);border-radius:999px;padding:.4rem .9rem}
.links{margin-top:32px;text-align:center}
.links .eyebrow{display:block;margin-bottom:12px}
.links .pill{width:100%;justify-content:center}
.cart{position:fixed;left:0;right:0;bottom:0;background:var(--night);color:var(--night-ink);padding:12px 16px;display:none}
.cart.on{display:block}
.cart .inner{width:min(560px,100%);margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--sub);font-weight:600}
.msg{text-align:center;color:var(--ink-2);margin-top:16px;min-height:1.5em}
</style>

<header class="lib-head">
  <a href="/" class="mark" aria-label="Lorraen Madre home">Lorraen&nbsp;Madre<span>Time . space + Story</span></a>
  <span class="eyebrow">Play</span>
  <h1>The Library</h1>
  <p>Tools, calendars and frameworks for making wishes real.</p>
</header>

<div class="wrap lib">

  <ol class="list" id="list" aria-label="Library products"></ol>
  <noscript><p class="msg">Turn on JavaScript to browse the Library.</p></noscript>

  <section class="links" id="links" aria-label="More destinations" hidden>
    <span class="eyebrow">Also from Lorraen Madre</span>
    <div id="links-list"></div>
  </section>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
</div>

<div class="cart" id="cart" role="region" aria-label="Your selection">
  <div class="inner">
    <span id="cart-text">0 items</span>
    <button class="pill solid" id="checkout" type="button">Checkout</button>
  </div>
</div>

<script>
(async function(){
  const list = document.getElementById("list");
  const msg = document.getElementById("msg");
  let data;
  try{ data = await (await fetch("/library/products.json", {cache:"no-cache"})).json(); }
  catch(e){ msg.textContent = "The Library couldn't load. Please refresh."; return; }

  const esc = s => String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const cart = new Map(); // key: product.id|priceIndex -> {price, product}

  const visible = data.products
    .filter(p => p.availability !== "unpublished")
    .sort((a,b) => a.display_order - b.display_order);

  visible.forEach((p,i) => {
    const li = document.createElement("li");
    li.className = "card"; li.id = p.id;
    const buyable = (p.prices||[]).filter(pr => pr.stripe_price_id || pr.checkout_url);
    let actions = "";
    if (buyable.length){
      (p.prices||[]).forEach((pr,idx) => {
        if (pr.stripe_price_id){
          actions += `<button class="pill solid" type="button" aria-pressed="false" data-key="${esc(p.id)}|${idx}">Add ${esc(pr.label)}</button>`;
        } else if (pr.checkout_url){
          actions += `<a class="pill solid" href="${esc(pr.checkout_url)}">Buy ${esc(pr.label)}</a>`;
        }
      });
    } else {
      const priceText = (p.prices||[]).map(pr => pr.label).join(" · ");
      if (priceText) actions += `<span class="price gold">${esc(priceText)}</span>`;
    }
    if (p.destination){
      const ext = /^https?:/.test(p.destination);
      actions += `<a class="pill design" href="${esc(p.destination)}"${ext?' target="_blank" rel="noreferrer"':''}>Explore</a>`;
    }
    if (!buyable.length && !p.destination) actions += `<span class="tag">Coming soon</span>`;
    else if (!buyable.length && p.availability === "coming_soon") actions += `<span class="tag">Coming soon</span>`;

    li.innerHTML = `
      <div class="row"><h2>${esc(p.title)}</h2><span class="num">${String(i+1).padStart(2,"0")}</span></div>
      ${p.house ? `<span class="eyebrow">${esc(p.house)}</span>` : ""}
      <p class="desc">${esc(p.short_description)}</p>
      <div class="actions">${actions}</div>`;
    list.appendChild(li);
  });

  // external linked destinations (e.g. OMW) — outside the numbered order
  const links = (data.links||[]).filter(l => l.published && l.url);
  if (links.length){
    document.getElementById("links").hidden = false;
    document.getElementById("links-list").innerHTML = links.map(l =>
      `<a class="pill watch" href="${esc(l.url)}" target="_blank" rel="noreferrer">${esc(l.title)}</a>`).join("");
  }

  // honor #anchor after async render
  if (location.hash){ const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }

  // multi-item cart (only for prices that carry a stripe_price_id)
  const cartEl = document.getElementById("cart"), cartText = document.getElementById("cart-text");
  const sync = () => {
    cartEl.classList.toggle("on", cart.size > 0);
    cartText.textContent = cart.size + (cart.size === 1 ? " item" : " items");
  };
  list.addEventListener("click", e => {
    const b = e.target.closest("button[data-key]"); if (!b) return;
    const key = b.dataset.key;
    if (cart.has(key)){ cart.delete(key); b.setAttribute("aria-pressed","false"); }
    else {
      // one billing choice per product (e.g. monthly OR yearly)
      const pid = key.split("|")[0];
      [...cart.keys()].filter(k => k.split("|")[0] === pid).forEach(k => {
        cart.delete(k); const o = list.querySelector(`[data-key="${CSS.escape(k)}"]`); if (o) o.setAttribute("aria-pressed","false");
      });
      cart.set(key, true); b.setAttribute("aria-pressed","true");
    }
    sync();
  });
  document.getElementById("checkout").addEventListener("click", async () => {
    const btn = document.getElementById("checkout");
    btn.disabled = true; msg.textContent = "Opening secure checkout…";
    try{
      const items = [...cart.keys()].map(k => { const [id, idx] = k.split("|"); return { id, price_index: +idx }; });
      const r = await fetch("/api/checkout", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ items }) });
      const j = await r.json();
      if (!r.ok || !j.url) throw new Error(j.error || "Checkout unavailable");
      location.href = j.url;
    }catch(err){
      btn.disabled = false; msg.textContent = "Checkout isn't available right now. Please try again shortly.";
    }
  });
})();
</script>
