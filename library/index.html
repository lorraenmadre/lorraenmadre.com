<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Lorraen Madre Library</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The Lorraen Madre Library — tools, calendars, frameworks and sprints for making wishes real.">
<link rel="canonical" href="https://www.lorraenmadre.com/library/">
<meta name="theme-color" content="#181713">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Belleza&family=Figtree:wght@400;500;600;700&family=Mulish:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#FCFBF8;--panel:#F4F1EA;--ink:#1B1A17;--ink-2:#5C584E;--ink-3:#8A8478;
  --line:rgba(27,26,23,.14);--gold:#D6A441;--gold-deep:#6E4E15;--gold-soft:#F0E2C4;--spirit:#0C7A46;
  --display:"Belleza","Optima","Gill Sans",sans-serif;
  --sub:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --sans:"Mulish",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#151410;--panel:#1D1B16;--ink:#F1EDE3;--ink-2:#ABA491;--ink-3:#847D6C;
    --line:rgba(241,237,227,.16);--gold:#E1B45C;--gold-deep:#F0DBA9;--gold-soft:#3A2E14;--spirit:#43C98A;
  }
}
:root[data-theme="dark"]{
  --paper:#151410;--panel:#1D1B16;--ink:#F1EDE3;--ink-2:#ABA491;--ink-3:#847D6C;
  --line:rgba(241,237,227,.16);--gold:#E1B45C;--gold-deep:#F0DBA9;--gold-soft:#3A2E14;--spirit:#43C98A;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:3px;border-radius:4px}
.wrap{width:min(560px,100% - 32px);margin:0 auto;padding:40px 0 120px}
.top{text-align:center;margin-bottom:28px}
.top a.home{font-family:var(--sub);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);text-decoration:none}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2rem,8vw,2.8rem);margin:.4rem 0 .2rem}
.top p{color:var(--ink-2);margin:0}
.list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px;scroll-margin-top:16px}
.card:target{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.card h2{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0}
.house{font-family:var(--sub);font-weight:700;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--spirit)}
.num{font-family:var(--sub);font-size:.7rem;color:var(--ink-3)}
.desc{color:var(--ink-2);margin:.35rem 0 .8rem;font-size:.95rem}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:.4rem;min-height:40px;padding:.5rem 1rem;border-radius:999px;border:1.5px solid var(--ink);
  background:transparent;color:var(--ink);font-family:var(--sub);font-weight:700;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;cursor:pointer}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-deep)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tag{font-family:var(--sub);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);border:1px dashed var(--line);border-radius:999px;padding:.35rem .8rem}
.price{font-family:var(--sub);font-weight:600;font-size:.85rem}
.links{margin-top:28px}
.links h3{font-family:var(--sub);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);text-align:center;margin:0 0 10px;font-weight:700}
.link{display:block;text-align:center;padding:14px;border-radius:999px;border:1.5px solid var(--ink);text-decoration:none;font-family:var(--sub);font-weight:700}
.cart{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper);padding:12px 16px;display:none}
.cart.on{display:block}
.cart .inner{width:min(560px,100%);margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.cart .btn{border-color:var(--gold);background:var(--gold);color:var(--gold-deep)}
.msg{text-align:center;color:var(--ink-2);margin-top:16px;min-height:1.5em}
</style>

<div class="wrap">
  <header class="top">
    <a class="home" href="/">&larr; Lorraen Madre</a>
    <h1>The Library</h1>
    <p>Tools for time, space + story.</p>
  </header>

  <ol class="list" id="list" aria-label="Library products"></ol>
  <noscript><p class="msg">Turn on JavaScript to browse the Library.</p></noscript>

  <section class="links" id="links" aria-label="More destinations" hidden>
    <h3>Also from Lorraen Madre</h3>
    <div id="links-list"></div>
  </section>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
</div>

<div class="cart" id="cart" role="region" aria-label="Your selection">
  <div class="inner">
    <span id="cart-text">0 items</span>
    <button class="btn" id="checkout" type="button">Checkout</button>
  </div>
</div>

<script>
(async function(){
  const list = document.getElementById("list");
  const msg = document.getElementById("msg");
  let data;
  try{ data = await (await fetch("/library/products.json", {cache:"no-cache"})).json(); }
  catch(e){ msg.textContent = "The Library couldn't load. Please refresh."; return; }

  const esc = s => String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const cart = new Map(); // key: product.id|priceIndex -> {price, product}

  const visible = data.products
    .filter(p => p.availability !== "unpublished")
    .sort((a,b) => a.display_order - b.display_order);

  visible.forEach((p,i) => {
    const li = document.createElement("li");
    li.className = "card"; li.id = p.id;
    const buyable = (p.prices||[]).filter(pr => pr.stripe_price_id || pr.checkout_url);
    let actions = "";
    if (buyable.length){
      (p.prices||[]).forEach((pr,idx) => {
        if (pr.stripe_price_id){
          actions += `<button class="btn gold" type="button" aria-pressed="false" data-key="${esc(p.id)}|${idx}">Add ${esc(pr.label)}</button>`;
        } else if (pr.checkout_url){
          actions += `<a class="btn gold" href="${esc(pr.checkout_url)}">Buy ${esc(pr.label)}</a>`;
        }
      });
    } else {
      const priceText = (p.prices||[]).map(pr => pr.label).join(" · ");
      if (priceText) actions += `<span class="price">${esc(priceText)}</span>`;
    }
    if (p.destination){
      const ext = /^https?:/.test(p.destination);
      actions += `<a class="btn" href="${esc(p.destination)}"${ext?' target="_blank" rel="noreferrer"':''}>Explore</a>`;
    }
    if (!buyable.length && !p.destination) actions += `<span class="tag">Coming soon</span>`;
    else if (!buyable.length && p.availability === "coming_soon") actions += `<span class="tag">Coming soon</span>`;

    li.innerHTML = `
      <div class="row"><h2>${esc(p.title)}</h2><span class="num">${String(i+1).padStart(2,"0")}</span></div>
      ${p.house ? `<div class="house">${esc(p.house)}</div>` : ""}
      <p class="desc">${esc(p.short_description)}</p>
      <div class="actions">${actions}</div>`;
    list.appendChild(li);
  });

  // external linked destinations (e.g. OMW) — outside the numbered order
  const links = (data.links||[]).filter(l => l.published && l.url);
  if (links.length){
    document.getElementById("links").hidden = false;
    document.getElementById("links-list").innerHTML = links.map(l =>
      `<a class="link" href="${esc(l.url)}" target="_blank" rel="noreferrer">${esc(l.title)}</a>`).join("");
  }

  // honor #anchor after async render
  if (location.hash){ const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }

  // multi-item cart (only for prices that carry a stripe_price_id)
  const cartEl = document.getElementById("cart"), cartText = document.getElementById("cart-text");
  const sync = () => {
    cartEl.classList.toggle("on", cart.size > 0);
    cartText.textContent = cart.size + (cart.size === 1 ? " item" : " items");
  };
  list.addEventListener("click", e => {
    const b = e.target.closest("button[data-key]"); if (!b) return;
    const key = b.dataset.key;
    if (cart.has(key)){ cart.delete(key); b.setAttribute("aria-pressed","false"); }
    else {
      // one billing choice per product (e.g. monthly OR yearly)
      const pid = key.split("|")[0];
      [...cart.keys()].filter(k => k.split("|")[0] === pid).forEach(k => {
        cart.delete(k); const o = list.querySelector(`[data-key="${CSS.escape(k)}"]`); if (o) o.setAttribute("aria-pressed","false");
      });
      cart.set(key, true); b.setAttribute("aria-pressed","true");
    }
    sync();
  });
  document.getElementById("checkout").addEventListener("click", async () => {
    const btn = document.getElementById("checkout");
    btn.disabled = true; msg.textContent = "Opening secure checkout…";
    try{
      const items = [...cart.keys()].map(k => { const [id, idx] = k.split("|"); return { id, price_index: +idx }; });
      const r = await fetch("/api/checkout", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ items }) });
      const j = await r.json();
      if (!r.ok || !j.url) throw new Error(j.error || "Checkout unavailable");
      location.href = j.url;
    }catch(err){
      btn.disabled = false; msg.textContent = "Checkout isn't available right now. Please try again shortly.";
    }
  });
})();
</script>
